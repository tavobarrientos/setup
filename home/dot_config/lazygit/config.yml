# lazygit config — managed by chezmoi.
gui:
  # Catppuccin Mocha (blue accent) — matches the nvim/yazi flavor.
  # Source: github.com/catppuccin/lazygit themes-mergable/mocha/blue.yml
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  showCommandLog: true
  showIcons: true
  nerdFontsVersion: "3"
git:
  paging:
    colorArg: always
    pager: delta --paging=never
  commit:
    signOff: false
  autoFetch: true
  autoRefresh: true
update:
  method: prompt
