# keymap.toml — managed by chezmoi.
# Docs: https://yazi-rs.github.io/docs/configuration/keymap
# prepend_keymap wins over Yazi's defaults.

[mgr]
prepend_keymap = [
  # Smart enter: open the file, or cd into the directory.
  { on = "<Enter>", run = "plugin smart-enter", desc = "Open file / enter dir" },

  # zoxide jump (built-in plugin; mirrors the default `z` binding, kept explicit).
  { on = "z", run = "plugin zoxide", desc = "Jump to a directory (zoxide)" },
  # fuzzy file/dir jump (built-in fzf plugin).
  { on = "Z", run = "plugin fzf", desc = "Jump via fzf" },

  # Open lazygit in the current directory, blocking until it exits.
  { on = ["g", "l"], run = "shell --block -- lazygit", desc = "Open lazygit here" },

  # Drop into a shell in the current directory.
  { on = "!", run = 'shell "$SHELL" --block', desc = "Open shell here" },
]
